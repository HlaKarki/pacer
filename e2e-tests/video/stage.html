<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Literata'; src: url('../../node_modules/@fontsource-variable/literata/files/literata-latin-opsz-normal.woff2') format('woff2'); font-weight: 200 900; }
@font-face { font-family: 'Instrument Sans'; src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 400 700; }
:root { --ink: #1b2126; --marker: #fbe17a; --bg: #e4e7e1; --bg2: #d8dcd4; --cap: #1b2126; --soft: #5b646c; --shadow: 0 30px 80px rgba(24, 34, 44, 0.16), 0 0 0 1px rgba(24, 34, 44, 0.07); }
body[data-theme='ink'] { --bg: #1c2024; --bg2: #121518; --cap: #eef0ec; --soft: #98a1a9; --shadow: 0 40px 110px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.07); }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { position: relative; background: linear-gradient(180deg, var(--bg), var(--bg2)); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

.cap { position: absolute; left: 0; right: 0; top: 56px; text-align: center; color: var(--cap); font-size: 54px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }

.win { position: absolute; left: 192px; top: 176px; width: 1536px; border-radius: 18px 18px 0 0; overflow: hidden; box-shadow: var(--shadow); transform-origin: 50% 0; }
.strip { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #e8eaed; }
.strip i { width: 14px; height: 14px; border-radius: 50%; background: #c6cad0; }
.view { position: relative; width: 1536px; height: 864px; overflow: hidden; background: #fbfaf7; }
.view img { position: absolute; left: 0; top: 0; width: 1536px; height: 864px; transform-origin: 0 0; }

.rsvp { position: absolute; inset: 0; background: #f3f3f1; display: grid; place-items: center; }
.rsvp .box { position: relative; width: 760px; height: 220px; border-top: 2px solid #d6d6d2; border-bottom: 2px solid #d6d6d2; }
.rsvp .box::before, .rsvp .box::after { content: ''; position: absolute; left: 50%; width: 2px; height: 26px; background: #d6d6d2; }
.rsvp .box::before { top: 0; }
.rsvp .box::after { bottom: 0; }
.rsvp .word { position: absolute; top: 50%; transform: translateY(-50%); font-family: 'Literata', Georgia, serif; font-size: 84px; font-weight: 500; color: #2a2a2a; white-space: pre; }
.rsvp .word b { font-weight: 500; color: #d2361f; }
.rsvp .wpm { position: absolute; right: 0; bottom: -46px; font-size: 22px; color: #8c8c88; font-variant-numeric: tabular-nums; }
.lid { position: absolute; left: 0; right: 0; top: 0; height: 150%; background: linear-gradient(to bottom, #0d0e10 0%, #0d0e10 68%, rgba(13, 14, 16, 0.85) 76%, rgba(13, 14, 16, 0) 100%); }
.lid.low { top: auto; bottom: 0; height: 40%; background: linear-gradient(to top, #0d0e10 0%, #0d0e10 40%, rgba(13, 14, 16, 0) 100%); }

.keys { position: absolute; left: 0; right: 0; top: 34px; display: flex; justify-content: center; gap: 14px; pointer-events: none; }
.key { min-width: 76px; height: 76px; padding: 0 22px; display: grid; place-items: center; border-radius: 16px; background: #1d2127; color: #fff; font-size: 32px; font-weight: 600; letter-spacing: -0.01em; box-shadow: 0 6px 0 #0b0d10, 0 16px 34px rgba(0, 0, 0, 0.28); }
.keyrow { display: flex; gap: 14px; }

.cursor { position: absolute; left: 0; top: 0; width: 54px; height: 54px; transform-origin: 8px 5px; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3)); }
.ripple { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--ink); }

.end { position: absolute; inset: 0; background: linear-gradient(180deg, var(--bg), var(--bg2)); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--cap); }
.end .mark { position: relative; isolation: isolate; font-family: 'Literata', Georgia, serif; font-size: 180px; font-weight: 640; letter-spacing: -0.01em; color: var(--ink); padding: 0 0.22em 0.04em; line-height: 1.25; }
.end .mark::before { content: ''; position: absolute; inset: 0; border-radius: 0.1em; background: var(--marker); transform-origin: 0 50%; transform: scaleX(var(--sweep, 1)); z-index: -1; }
.end .mark span { position: relative; }
.end .tag { margin-top: 58px; font-size: 52px; font-weight: 600; letter-spacing: -0.015em; }
.end .where { margin-top: 22px; font-size: 38px; color: var(--soft); }
</style>
</head>
<body>
<div class="cap" id="cap0"></div>
<div class="cap" id="cap1"></div>
<div class="win" id="win">
  <div class="strip"><i></i><i></i><i></i></div>
  <div class="view" id="view">
    <img id="l0" alt=""><img id="l1" alt="">
    <div class="rsvp" id="rsvp"><div class="box"><div class="word" id="word"></div><div class="wpm">500 wpm</div></div></div>
    <div class="lid" id="lid"></div><div class="lid low" id="lidLow"></div>
    <div class="keys" id="keys"></div>
    <div class="ripple" id="ripple"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 40 40"><path d="M6 4 L6 33 L13.5 26 L18.5 37 L23.5 35 L18.6 24.2 L28.5 24 Z" fill="#111" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
  </div>
</div>
<div class="end" id="end">
  <div class="mark" id="mark"><span>Pacer</span></div>
  <div class="tag" id="tag">Free and open source. No account, no tracking.</div>
  <div class="where" id="where">Chrome, Obsidian and pacer.hla.dev</div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const imgs = [$('l0'), $('l1')]
const show = (el, o, transform = '') => {
  el.style.opacity = String(o)
  el.style.visibility = o > 0 ? 'visible' : 'hidden'
  el.style.transform = transform
}

function placeWord(parts) {
  const word = $('word')
  word.innerHTML = ''
  if (!parts) return
  const [pre, orp, post] = parts
  const a = document.createElement('span')
  a.textContent = pre
  const b = document.createElement('b')
  b.textContent = orp
  word.append(a, b, document.createTextNode(post))
  // The fixed point is the box centre, so the red letter has to land on it.
  word.style.left = `${380 - a.offsetWidth - b.offsetWidth / 2}px`
}

window.render = async (s) => {
  const loads = []
  imgs.forEach((img, i) => {
    const l = s.layers[i]
    if (!l) return show(img, 0)
    if (img.dataset.src !== l.src) {
      img.dataset.src = l.src
      img.src = l.src
      loads.push(img.decode())
    }
    show(img, l.o, `translate(${l.x}px, ${l.y}px) scale(${l.s})`)
  })
  show($('rsvp'), s.rsvp ? s.rsvp.o : 0)
  if (s.rsvp) placeWord(s.rsvp.word)
  const lid = s.rsvp ? s.rsvp.lid : 0
  // The upper lid does almost all the work, and the lower one only rises a little to meet it.
  show($('lid'), lid > 0 ? 1 : 0, `translateY(${-100 + lid * 100}%)`)
  show($('lidLow'), lid > 0 ? 1 : 0, `translateY(${100 - lid * 100}%)`)
  $('rsvp').style.filter = lid > 0 ? `blur(${lid * 5}px) brightness(${1 - lid * 0.35})` : ''

  s.caps.forEach((c, i) => {
    const el = $(`cap${i}`)
    el.textContent = c ? c.text : ''
    show(el, c ? c.o : 0, c ? `translateY(${c.dy}px)` : '')
  })
  $('cap1').style.visibility = s.caps[1] ? 'visible' : 'hidden'

  const keys = $('keys')
  keys.innerHTML = ''
  for (const k of s.keys) {
    const row = document.createElement('div')
    row.className = 'keyrow'
    row.style.opacity = String(k.o)
    row.style.transform = `translateY(${k.dy}px) scale(${k.scale})`
    for (const label of k.labels) {
      const key = document.createElement('div')
      key.className = 'key'
      key.textContent = label
      if (k.down) {
        key.style.transform = 'translateY(5px)'
        key.style.boxShadow = '0 1px 0 #0b0d10, 0 8px 20px rgba(0, 0, 0, 0.28)'
      }
      row.append(key)
    }
    keys.append(row)
  }

  const c = s.cursor
  show($('cursor'), c ? c.o : 0, c ? `translate(${c.x - 8}px, ${c.y - 5}px) scale(${c.down ? 0.86 : 1})` : '')
  const r = c && c.ripple
  show($('ripple'), r ? r.o : 0, r ? `translate(${c.x - 60}px, ${c.y - 60}px) scale(${r.r})` : '')

  show($('win'), s.win.o, `translateY(${s.win.dy}px) scale(${s.win.scale})`)
  const e = s.end
  show($('end'), e.o)
  $('mark').style.setProperty('--sweep', String(e.sweep))
  $('mark').querySelector('span').style.opacity = String(e.word)
  show($('tag'), e.tag, `translateY(${(1 - e.tag) * 18}px)`)
  show($('where'), e.where, `translateY(${(1 - e.where) * 18}px)`)
  await Promise.all(loads)
}
</script>
</body>
</html>
