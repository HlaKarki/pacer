name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Obsidian rejects a release whose tag differs from manifest.json's version.
      - name: Check the tag matches every manifest
        run: |
          for f in package.json manifest.json extension/manifest.json; do
            v=$(jq -r .version "$f")
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "$f is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: bun test
      - run: bun run lint
      - run: bun run build
      - run: bun run zip:extension
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            main.js manifest.json styles.css "release/pacer-chrome-$GITHUB_REF_NAME.zip"
